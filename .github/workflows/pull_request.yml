name: Artifact Build

on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Ensure binary compatibility
      # This is to ensure that your code is backwards compatible.
      # If this fails you need to add a @Prerelease annotation to new code.
      run: ./gradlew library:checkKotlinAbi

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseDebug lint check

    # Temporary: the Actions log only prints the first lint error, so print
    # the full lint text report into the log to fix the errors. Remove this
    # step again once the lint errors are fixed.
    - name: Print lint report
      if: failure()
      run: cat app/build/intermediates/lint_intermediate_text_report/prereleaseDebug/lintReportPrereleaseDebug/lint-results-prereleaseDebug.txt || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
